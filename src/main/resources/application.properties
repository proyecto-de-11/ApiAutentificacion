spring.application.name=Autentificacion-service

# ? CONFIGURACI�N CON EUREKA EN LA NUBE
server.port=8082

# Spring cloud eureka - CONFIGURACI�N PARA EUREKA EN LA NUBE
spring.cloud.config.enabled=false
spring.cloud.compatibility-verifier.enabled=false

# ? EUREKA SERVER EN LA NUBE
eureka.client.service-url.defaultZone=
eureka.instance.instance-id=${spring.application.name}:${random.uuid}
# eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true

# ? CONFIGURACIONES IMPORTANTES PARA EUREKA EN LA NUBE
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.registry-fetch-interval-seconds=30
eureka.client.instance-info-replication-interval-seconds=30
eureka.client.initial-instance-info-replication-interval-seconds=40

# ? CONFIGURACIONES DE INSTANCIA PARA LA NUBE
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.instance.lease-expiration-duration-in-seconds=90
eureka.instance.metadata-map.startup=${random.int}

# ? HEALTH CHECKS PARA QUE EL GATEWAY PUEDA VERIFICAR EL SERVICIO
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.eureka.enabled=true

# ? CONFIGURACIONES ADICIONALES PARA LA NUBE
spring.cloud.discovery.enabled=true
spring.cloud.service-registry.auto-registration.enabled=true
#-------------------


# Puerto de la aplicación
server.port=8081

